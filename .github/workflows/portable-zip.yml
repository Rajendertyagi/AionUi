name: Build Windows Portable ZIP

on:
  push:
    branches: [portable-zip]
  workflow_dispatch:

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'

jobs:
  build:
    name: Build Windows x64 ZIP
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run postinstall
        run: bun run postinstall || true

      - name: Build Windows portable ZIP
        run: node scripts/build-with-builder.js x64 --win --x64 --config.win.target=zip

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: AionUi-win-x64-portable
          path: packages/desktop/out/*.zip
          if-no-files-found: error
