name: 'Build Portable Zip'

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: true
        default: 'main'
        type: string

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'
  NODE_OPTIONS: '--max-old-space-size=8192'

jobs:
  build-portable:
    name: Build Portable Zip (Windows x64)
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}

      - name: Get commit hash
        id: commit
        shell: bash
        run: |
          SHORT=$(git rev-parse --short HEAD)
          echo "short=$SHORT" >> $GITHUB_OUTPUT

      - name: Get version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Cache Electron artifacts
        id: electron-cache
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/.cache/electron
            ${{ runner.temp }}/.cache/electron-builder
            ${{ env.LOCALAPPDATA }}\electron-builder\Cache
          key: electron-cache-windows-x64-${{ hashFiles('package.json', 'bun.lock') }}
          restore-keys: |
            electron-cache-windows-x64-

      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: bun install --frozen-lockfile

      - name: Run postinstall
        run: bun run postinstall || true

      - name: Setup Windows build environment
        run: |
          bun install --global node-gyp
          echo "WindowsTargetPlatformVersion=10.0.19041.0" >> $env:GITHUB_ENV

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3
        with:
          vs-version: '17.0'

      - name: Rebuild native modules for Electron
        shell: pwsh
        run: |
          $electronVer = (node -p "require('./package.json').devDependencies.electron.replace(/[\^~]/g, '')").Trim()

          # Remove bun-managed symlink so electron-rebuild targets node_modules/better-sqlite3
          $bunLink = "node_modules\better-sqlite3"
          if (Test-Path $bunLink) {
            Write-Host "Removing bun symlink at $bunLink"
            Remove-Item $bunLink -Force
          }

          Write-Host "Trying prebuild-install for better-sqlite3..."
          $prebuildResult = bun x --yes prebuild-install --runtime=electron --target=$electronVer --platform=win32 --arch=x64 --force 2>&1
          if ($LASTEXITCODE -eq 0) {
            Write-Host "prebuild-install succeeded"
          } else {
            Write-Host "prebuild-install failed, falling back to electron-rebuild..."
            bunx electron-rebuild --only better-sqlite3 --force --arch x64 --electron-version $electronVer
          }

          $sqliteNode = "node_modules/better-sqlite3/build/Release/better_sqlite3.node"
          if (Test-Path $sqliteNode) {
            $size = [math]::Round((Get-Item $sqliteNode).Length / 1MB, 1)
            Write-Host "better-sqlite3 found: $size MB"
          } else {
            Write-Error "better-sqlite3 native module not found"
            exit 1
          }
        env:
          npm_config_runtime: electron
          npm_config_arch: x64
          npm_config_target_arch: x64
          npm_config_disturl: https://electronjs.org/headers
          npm_config_build_from_source: true
          MSVS_VERSION: 2022
          GYP_MSVS_VERSION: 2022

      - name: Prepare aioncore binary
        shell: bash
        run: node scripts/prepareAioncore.js
        env:
          AIONUI_BACKEND_ARCH: x64
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build with electron-builder
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Building Windows x64..."
          $env:NODE_OPTIONS = '--max-old-space-size=8192 --no-warnings'
          node scripts/build-with-builder.js x64 --win --x64 2>&1 | Select-String -NotMatch "Module level directives" | ForEach-Object { Write-Host $_ }
          Write-Host "Build completed"
        env:
          AIONUI_BACKEND_ARCH: x64
          NODE_OPTIONS: '--max-old-space-size=8192 --no-warnings'
          npm_config_arch: x64
          npm_config_target_arch: x64
          npm_config_runtime: electron
          npm_config_disturl: https://electronjs.org/headers
          npm_config_build_from_source: true
          npm_config_cache: ${{ runner.temp }}/.npm
          ELECTRON_CACHE: ${{ runner.temp }}/.cache/electron
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/.cache/electron-builder
          CI: true
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up portable build
        if: success()
        shell: pwsh
        run: |
          $unpackedDir = "out\win-unpacked"
          Write-Host "Cleaning up portable build..."
          Get-ChildItem -Path $unpackedDir -Recurse -Filter "*.map" -Force | Remove-Item -Force -Recurse -ErrorAction SilentlyContinue
          $largePkgs = @("@img", "@emnapi", "@node-sqlite", "sqlite3")
          foreach ($pkg in $largePkgs) {
            Get-ChildItem -Path $unpackedDir -Directory -Filter "$pkg*" -ErrorAction SilentlyContinue | ForEach-Object {
              Remove-Item -Path $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Get-ChildItem -Path $unpackedDir -Recurse -Directory -Filter "vendor" -ErrorAction SilentlyContinue | ForEach-Object {
            $parent = $_.Parent.Name
            if ($parent -notin @("better-sqlite3", "bcrypt", "node-pty")) {
              Remove-Item -Path $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          $removeFiles = @("*.ps1", "*.bat", "*.cmd", "LICENSE*", "NOTICE*", "*.txt")
          foreach ($pattern in $removeFiles) {
            Get-ChildItem -Path $unpackedDir -Recurse -Filter $pattern -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          }
          Get-ChildItem -Path $unpackedDir -Directory -Filter ".cache" -Recurse -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          $totalSize = (Get-ChildItem -Path $unpackedDir -Recurse -File | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host "Cleaned size: $([math]::Round($totalSize, 1)) MB"
        env:
          CI: true

      - name: Create portable folder zip
        if: success()
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $commit = "${{ steps.commit.outputs.short }}"
          $outDir = "out"
          $unpackedDir = Join-Path $outDir "win-unpacked"
          if (-not (Test-Path $unpackedDir)) {
            Write-Error "win-unpacked directory not found at $unpackedDir"
            exit 1
          }
          $zipName = "AionUi-portable-${version}-windows-x64-${commit}.zip"
          $zipPath = Join-Path $outDir $zipName
          Write-Host "Creating portable folder zip: $zipName"
          $tempZipDir = Join-Path $env:TEMP "aionui-zip-$$"
          New-Item -ItemType Directory -Path $tempZipDir -Force | Out-Null
          $items = Get-ChildItem -Path $unpackedDir -Recurse
          foreach ($item in $items) {
            $relPath = $item.FullName.Substring($unpackedDir.Length).TrimStart('\')
            $destPath = Join-Path $tempZipDir $relPath
            $destDir = Split-Path $destPath -Parent
            if (-not (Test-Path $destDir)) {
              New-Item -ItemType Directory -Path $destDir -Force | Out-Null
            }
            if ($item.PSIsContainer) { continue }
            Copy-Item -Path $item.FullName -Destination $destPath -Force
          }
          Compress-Archive -Path "$tempZipDir\*" -DestinationPath $zipPath -CompressionLevel Optimal
          Remove-Item -Path $tempZipDir -Recurse -Force
          Write-Host "Zip created: $zipPath"
          $zipSize = [math]::Round((Get-Item $zipPath).Length / 1MB, 1)
          Write-Host "Zip size: ${zipSize} MB"
        env:
          CI: true

      - name: List build artifacts
        if: success() || failure()
        shell: bash
        run: |
          echo "=========================================="
          echo "BUILD ARTIFACTS"
          echo "=========================================="
          if [ -d "out" ]; then
            ls -lh out/ || true
          else
            echo "No out directory found!"
          fi

      - name: Upload portable zip artifact
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: AionUi-portable-${{ steps.version.outputs.version }}-windows-x64
          path: |
            out/*.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Summary
        if: always()
        shell: bash
        run: |
          echo "## Build Portable Zip - Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Key | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ inputs.branch }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ steps.commit.outputs.short }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | \`${{ steps.version.outputs.version }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Output | Portable folder zip (win-unpacked) |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
